[package]
name = "tauri-updater-install-proof"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
tauri-plugin-updater = "=2.11.0"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
